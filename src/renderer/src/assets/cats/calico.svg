.cat-calico .inner { fill: var(--cat-inner, #E8B4AD); }
.cat-calico .iris { fill: var(--cat-iris, #272B2A); }
.cat-calico .pupil { fill: var(--cat-pupil, #272B2A); }
.cat-calico .shine { fill: var(--cat-shine, #FFFFFF); }
.cat-calico .nose { fill: var(--cat-nose, #D77D84); }
.cat-calico .blush { fill: var(--cat-blush, #E9AFAD); }
.cat-calico .ink { fill: none; stroke: var(--cat-ink, #8B5D59); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.cat-calico .outline { fill: none; stroke: var(--cat-outline, #DDCBB9); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }</style>
