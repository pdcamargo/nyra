[package]
name = "nyra"
version = "0.0.1"
description = "A better Claude Code client"
authors = ["Victor"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
# The desktop binary links against this; `_lib` avoids a name clash with the bin on Windows.
name = "nyra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.4"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs"] }
futures = "0.3"
async-recursion = "1"

# PTY for `claude /login` and the integrated terminal
portable-pty = "0.9"

# Triggers
notify = "8.2"
notify-debouncer-full = "0.7"
croner = "4"
chrono = "0.4"

# Webhook server
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }

# Marketplace
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "charset", "http2"] }

# Workflow condition expressions (JS semantics, pure Rust)
boa_engine = "0.22"

# User-supplied regex extractors need JS-flavoured features (lookaround/backrefs)
fancy-regex = "0.19"
regex = "1"

# File extraction
calamine = "0.36"
zip = { version = "8", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
quick-xml = "0.42"

base64 = "0.22"
rand = "0.10"
dirs = "7"
once_cell = "1"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
glob = "0.3"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Used by `tauri dev` / `tauri build --debug`
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# Deliberately NOT panic = "abort": the backend runs PDF/XML extraction and
# stream-json parsing on spawned tasks, and unwinding keeps a panic there
# contained to that task instead of taking the whole app down.
