[package]
name = "nyra"
version = "0.3.0"
description = "A better Claude Code client"
authors = ["Victor"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
# The desktop binary links against this; `_lib` avoids a name clash with the bin on Windows.
name = "nyra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.4"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.9"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Change detection for the skills Nyra keeps current in ~/.claude/skills.
# Already in the tree as a transitive dep, so this costs no extra build.
sha2 = "0.10"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "signal"] }
futures = "0.3"
async-recursion = "1"

# System font enumeration for the appearance settings. Pure Rust over
# ttf-parser, which lopdf already pulls in — no fontconfig/CoreText to link.
fontdb = { version = "0.23", default-features = false, features = ["fs"] }

# PTY for `claude /login` and the integrated terminal
portable-pty = "0.9"

# Triggers
notify = "8.2"
notify-debouncer-full = "0.7"
croner = "4"
chrono = "0.4"

# Webhook server
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }

# Marketplace
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "charset", "http2"] }

# Workflow condition expressions (JS semantics, pure Rust)
boa_engine = "0.22"

# User-supplied regex extractors need JS-flavoured features (lookaround/backrefs)
fancy-regex = "0.19"
regex = "1"

# File extraction
calamine = "0.36"
zip = { version = "8", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
quick-xml = "0.42"

# Voice dictation. `cpal` captures from CoreAudio here and from WASAPI/ALSA
# when the cross-platform port lands, so none of this needs revisiting then.
# Capturing natively rather than via getUserMedia keeps the CSP untouched and
# keeps audio off the IPC boundary entirely.
cpal = "0.18"
rubato = "5"
# whisper.cpp. `metal` makes build.rs set GGML_METAL_EMBED_LIBRARY=ON, which
# bakes the shader source into the binary and compiles it at runtime — no
# .metallib to ship and no metal compiler needed at build time.
whisper-rs = { version = "0.16", default-features = false, features = ["metal"] }

base64 = "0.22"
rand = "0.10"
dirs = "7"
once_cell = "1"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
glob = "0.3"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Inspecting our own WKWebView: a screenshot that needs no Screen Recording
# permission, and JS evaluation that needs no cooperation from the renderer.
# See src/devtools.rs.
#
# All five are already in the tree via wry at these versions; what this adds is
# generated code wry had no use for (`WKSnapshotConfiguration`,
# `NSBitmapImageRep`). Turning those on does pull three more binding crates —
# objc2-core-video, objc2-javascript-core, objc2-security — which are feature
# dependencies of objc2-app-kit and objc2-web-kit rather than anything we call.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSError", "NSDictionary", "NSValue", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", features = [
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphicsContext",
  "objc2-core-graphics",
] }
objc2-web-kit = { version = "0.3", features = [
  "objc2-app-kit",
  "block2",
  "WKWebView",
  "WKSnapshotConfiguration",
] }

[features]
# Used by `tauri dev` / `tauri build --debug`
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# Deliberately NOT panic = "abort": the backend runs PDF/XML extraction and
# stream-json parsing on spawned tasks, and unwinding keeps a panic there
# contained to that task instead of taking the whole app down.
