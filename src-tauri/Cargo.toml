[package]
name = "nyra"
version = "0.7.0"
description = "A better Claude Code client"
authors = ["Victor"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
# The desktop binary links against this; `_lib` avoids a name clash with the bin on Windows.
name = "nyra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-notification = "2.4"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.9"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Change detection for the skills Nyra keeps current in ~/.claude/skills.
# Already in the tree as a transitive dep, so this costs no extra build.
sha2 = "0.10"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "signal"] }
futures = "0.3"
async-recursion = "1"

# System font enumeration for the appearance settings. Pure Rust over
# ttf-parser, which lopdf already pulls in — no fontconfig/CoreText to link.
fontdb = { version = "0.23", default-features = false, features = ["fs"] }

# PTY for `claude /login` and the integrated terminal
portable-pty = "0.9"

# Triggers
notify = "8.2"
notify-debouncer-full = "0.7"
croner = "4"
chrono = "0.4"

# Webhook server
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }

# Marketplace
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs", "charset", "http2"] }

# Workflow condition expressions (JS semantics, pure Rust)
boa_engine = "0.22"

# User-supplied regex extractors need JS-flavoured features (lookaround/backrefs)
fancy-regex = "0.19"
regex = "1"

# File extraction
calamine = "0.36"
zip = { version = "8", default-features = false, features = ["deflate"] }
pdf-extract = "0.12"
quick-xml = "0.42"

# Voice dictation. `cpal` captures from CoreAudio here and from WASAPI/ALSA
# when the cross-platform port lands, so none of this needs revisiting then.
# Capturing natively rather than via getUserMedia keeps the CSP untouched and
# keeps audio off the IPC boundary entirely.
cpal = "0.18"
rubato = "5"
# whisper.cpp is per target, below: Metal on macOS, the CPU build elsewhere.

base64 = "0.22"
rand = "0.10"
dirs = "7"
once_cell = "1"
parking_lot = "0.12"
anyhow = "1"
thiserror = "2"
glob = "0.3"
log = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Process liveness (`OpenProcess`), and canonical paths without the `\\?\`
# prefix. Both already in the tree through tokio and tauri. See src/platform/.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  # The process table behind Chat RAM: parents and working sets.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  # The port pill: a shell's command line and start time, and who is listening.
  "Wdk_System_Threading",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
] }
dunce = "1"
# `nyra-dev shot` and `eval` (src/devtools.rs): the WebView2 behind the window.
# Already in the tree through wry at this version.
webview2-com = "0.38"
# Desktop control (src/desktop/windows.rs): UI Automation for the tree,
# SendInput for keys and clicks, Windows.Graphics.Capture (PrintWindow as the
# fallback) and WIC for screenshots, the shell's AppsFolder for app names.
# The same 0.61 tauri already builds, so this adds features, not a crate.
windows = { version = "0.61", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# Notifications that know they were clicked (src/notify_user.rs). The toast
# builder notify-rust uses underneath, already in the tree at this version; the
# plugin drops the `Activated` callback it exposes.
tauri-winrt-notification = "0.7"

# `metal` makes build.rs set GGML_METAL_EMBED_LIBRARY=ON, which bakes the
# shader source into the binary and compiles it at runtime — no .metallib to
# ship and no metal compiler needed at build time.
[target.'cfg(target_os = "macos")'.dependencies.whisper-rs]
version = "0.16"
default-features = false
features = ["metal"]

# The CPU build. Fast enough for the base model; a GPU backend (Vulkan, CUDA)
# is a feature flag here when someone needs one.
[target.'cfg(not(target_os = "macos"))'.dependencies.whisper-rs]
version = "0.16"
default-features = false

# Inspecting our own WKWebView: a screenshot that needs no Screen Recording
# permission, and JS evaluation that needs no cooperation from the renderer.
# See src/devtools.rs.
#
# All five are already in the tree via wry at these versions; what this adds is
# generated code wry had no use for (`WKSnapshotConfiguration`,
# `NSBitmapImageRep`). Turning those on does pull three more binding crates —
# objc2-core-video, objc2-javascript-core, objc2-security — which are feature
# dependencies of objc2-app-kit and objc2-web-kit rather than anything we call.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSError", "NSDictionary", "NSValue", "NSUserDefaults", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = [
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphicsContext",
  "objc2-core-graphics",
  # Desktop control: an app's icon for the miniature (src/desktop/macos.rs).
  "NSRunningApplication",
] }
objc2-web-kit = { version = "0.3", features = [
  "objc2-app-kit",
  "block2",
  "WKWebView",
  "WKSnapshotConfiguration",
] }
# Notifications that know they were clicked (src/notify_user.rs). What the
# notification plugin posts through, already in the tree at this version; the
# plugin throws away the handle that waits for the click.
notify-rust = "4.18"

[features]
# Used by `tauri dev` / `tauri build --debug`
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# Deliberately NOT panic = "abort": the backend runs PDF/XML extraction and
# stream-json parsing on spawned tasks, and unwinding keeps a panic there
# contained to that task instead of taking the whole app down.
